name: mongo-sharding-repl
services:
  configSvr:
    image: mongo:latest
    container_name: configSvr 
    ports:
      - 27017:27017
    volumes:
      - config-data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27017"
      ] 

  shard1_repl1:
    image: mongo:latest
    container_name: shard1_repl1
    ports:
      - 27018:27018
    volumes:
      - shard1_repl1-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1",
        "--bind_ip_all",
        "--port",
        "27018"
      ]

  shard1_repl2:
    image: mongo:latest
    container_name: shard1_repl2
    ports:
      - 27019:27019
    volumes:
      - shard1_repl2-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1",
        "--bind_ip_all",
        "--port",
        "27019"
      ]

  shard1_repl3:
    image: mongo:latest
    container_name: shard1_repl3
    ports:
      - 27020:27020
    volumes:
      - shard1_repl3-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1",
        "--bind_ip_all",
        "--port",
        "27020"
      ]

  shard2_repl1:
    image: mongo:latest
    container_name: shard2_repl1
    ports:
      - 27021:27021
    volumes:
      - shard2_repl1-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard2",
        "--bind_ip_all",
        "--port",
        "27021"
      ]

  shard2_repl2:
    image: mongo:latest
    container_name: shard2_repl2
    ports:
      - 27022:27022
    volumes:
      - shard2_repl2-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard2",
        "--bind_ip_all",
        "--port",
        "27022"
      ]

  shard2-repl3:
    image: mongo:latest
    container_name: shard2_repl3
    ports:
      - 27023:27023
    volumes:
      - shard2_repl3-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard2",
        "--bind_ip_all",
        "--port",
        "27023"
      ]

  mongos_router:
    image: mongo:latest
    container_name: mongos_router
    ports:
      - 27024:27024
    command:
      [
        "mongos",
        "--configdb", 
        "config_server/configSvr:27017",
        "--bind_ip_all",
        "--port",
        "27024"
      ]
  redis:
    image: "redis:latest"
    container_name: redis
    ports:
      - "6379"
    volumes:
      - redis_data:/data

  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    image: kazhem/pymongo_api:1.0.0
    depends_on:
      - configSvr
      - mongos_router
      - shard1_repl1
      - shard1_repl2
      - shard1_repl3
      - shard2_repl1
      - shard2_repl2
      - shard2_repl3
      - redis
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos_router:27024"
      MONGODB_DATABASE_NAME: "somedb"
      REDIS_URL: "redis://redis:6379"

volumes:
  config-data:
  shard1_repl1-data:
  shard1_repl2-data:
  shard1_repl3-data:
  shard2_repl1-data:
  shard2_repl2-data:
  shard2_repl3-data:
  redis_data: